
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17233e">
  <title>MONDAI - 一問一答学習アプリ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="header">
  <a href="./" class="logo">MONDAI<span> STUDY SYSTEM</span></a>
  <div id="account"></div>
</header>

<div id="notice" role="status" aria-live="polite"></div>

<section id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1>MONDAI</h1>
    <p class="muted">知識を積み重ねる、一問一答。</p>
    <form id="auth-form">
      <label>メールアドレス
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>パスワード
        <input id="password" type="password"
          autocomplete="current-password" minlength="6" required>
      </label>
      <button type="submit">ログイン</button>
      <button type="button" id="register" class="secondary">新規登録</button>
      <button type="button" id="reset-password" class="ghost">パスワードを忘れた場合</button>
    </form>
  </div>
</section>

<section id="profile-screen" class="auth-screen" hidden>
  <div class="auth-card">
    <h2>ニックネーム設定</h2>
    <p>他のユーザーとのデッキ共有に使用します。本名などの個人情報は避けてください。</p>
    <form id="profile-form">
      <label>ニックネーム
        <input id="nickname" minlength="2" maxlength="24" required>
      </label>
      <button type="submit">登録する</button>
    </form>
  </div>
</section>

<div id="app-screen" class="layout" hidden>
  <aside class="sidebar" id="navigation">
    <div class="nav-label">LIBRARY</div>
    <button data-page="home">ホーム</button>
    <button data-page="mine">マイデッキ</button>
    <button data-page="public">公開デッキ</button>
    <button data-page="shared">共有デッキ</button>
    <button data-page="settings">設定</button>
  </aside>
  <main id="main"></main>
</div>

<template id="deck-template">
  <article class="deck-card">
    <div class="deck-heading">
      <h3 class="deck-name"></h3>
      <span class="visibility"></span>
    </div>
    <p class="deck-meta muted"></p>
    <div class="deck-actions"></div>
  </article>
</template>

<footer class="footer">MONDAI / Study System</footer>

<script type="module" src="./script.js"></script>
</body>
</html>
