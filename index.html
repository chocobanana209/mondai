<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問題・解答データ閲覧アプリ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- docx-preview Library (Wordファイルをブラウザ上で高精度レンダリング) -->
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.min.js"></script>
  
  <!-- LZ-String Library (データ圧縮用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

  <!-- Firebase Web SDK (v10) Module Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      getDocs, 
      query, 
      orderBy, 
      serverTimestamp,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase設定情報
    const firebaseConfig = {
      apiKey: "AIzaSyAat1qoigRFAQtIwCHweMeO6P0qTmR10_8",
      authDomain: "mondai-choco.firebaseapp.com",
      projectId: "mondai-choco",
      appId: "1:41081435290:web:f5237845a870e11e719b23"
    };

    // Firebase 初期化
    let app, auth, db;
    let currentUser = null;
    let selectedDocId = null;
    let activeTab = 'question'; // 'question' または 'answer'
    let currentDocData = null; // 現在選択中のドキュメント全データ

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);

      // ログイン状態をローカルストレージに永続化する設定
      setPersistence(auth, browserLocalPersistence).catch((error) => {
        console.error("Persistence setting error:", error);
      });
    } catch (e) {
      console.error("Firebase initialization failed:", e);
      alert("Firebaseの初期化に失敗しました。設定を確認してください。");
    }

    // 認証状態の監視（リロード時にも確実に発火します）
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      updateAuthUI(user);
      
      if (user) {
        try {
          // リロード時にトークンを強制リフレッシュして確実に権限を通す
          await user.getIdToken(true);
          await loadDocumentList();
        } catch (error) {
          console.error("Token refresh or document load error:", error);
        }
      } else {
        clearDocumentView();
        document.getElementById('doc-list').innerHTML = '<p class="text-gray-500 text-sm italic p-2">ログインするとデータが表示されます。</p>';
      }
    });

    // ログインUIの更新
    function updateAuthUI(user) {
      const authStatus = document.getElementById('auth-status');
      const loginBtn = document.getElementById('login-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const userInfo = document.getElementById('user-info');
      const userPhoto = document.getElementById('user-photo');
      const userName = document.getElementById('user-name');
      const mainContent = document.getElementById('main-content');

      if (user) {
        authStatus.innerText = "ログイン中";
        authStatus.className = "px-2 py-1 bg-green-100 text-green-800 rounded text-xs font-semibold";
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        userInfo.classList.remove('hidden');
        userPhoto.src = user.photoURL || 'https://via.placeholder.com/40';
        userName.innerText = user.displayName || user.email;
        mainContent.classList.remove('opacity-50', 'pointer-events-none');
      } else {
        authStatus.innerText = "未ログイン";
        authStatus.className = "px-2 py-1 bg-gray-100 text-gray-800 rounded text-xs font-semibold";
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        userInfo.classList.add('hidden');
        mainContent.classList.add('opacity-50', 'pointer-events-none');
      }
    }

    // Googleログイン処理
    document.getElementById('login-btn').addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Login failed:", error);
        alert(`ログインエラー: ${error.message}`);
      }
    });

    // ログアウト処理
    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Logout failed:", error);
      }
    });

    // WordファイルをArrayBufferから圧縮用Base64へ変換するヘルパー
    function arrayBufferToBase64(buffer) {
      return new Promise((resolve) => {
        const blob = new Blob([buffer]);
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // 保存・アロード処理
    const questionFileInput = document.getElementById('question-file-input');
    const answerFileInput = document.getElementById('answer-file-input');
    const tagsInput = document.getElementById('tags-input');
    const saveBtn = document.getElementById('save-doc-btn');
    const loadingSpinner = document.getElementById('loading-spinner');

    saveBtn.addEventListener('click', async () => {
      if (!currentUser) {
        alert("ログインが必要です。");
        return;
      }

      const qFile = questionFileInput.files[0];
      const aFile = answerFileInput.files[0];

      if (!qFile) {
        alert("問題データ(.docx)のファイルを選択してください。");
        return;
      }

      loadingSpinner.classList.remove('hidden');

      try {
        // 問題ファイルの処理
        const qBuffer = await qFile.arrayBuffer();
        const qBase64 = await arrayBufferToBase64(qBuffer);
        const qCompressed = LZString.compressToUTF16(qBase64);

        // 解答ファイルの処理 (任意)
        let aCompressed = null;
        if (aFile) {
          const aBuffer = await aFile.arrayBuffer();
          const aBase64 = await arrayBufferToBase64(aBuffer);
          aCompressed = LZString.compressToUTF16(aBase64);
        }

        // タグのパース (カンマ/スペース区切り)
        const rawTags = tagsInput.value;
        const tags = rawTags.split(/[, \s]+/)
          .map(t => t.replace(/^#/, '').trim())
          .filter(t => t.length > 0);

        const docId = `doc_${Date.now()}`;
        const userDocRef = doc(db, "users", currentUser.uid, "documents", docId);

        await setDoc(userDocRef, {
          title: qFile.name.replace(/\.docx$/i, ''),
          questionData: qCompressed,
          answerData: aCompressed,
          tags: tags,
          updatedAt: serverTimestamp()
        });

        alert("問題・解答データを保存しました！");
        
        // フォームリセット
        questionFileInput.value = '';
        answerFileInput.value = '';
        tagsInput.value = '';
        
        loadDocumentList();

      } catch (error) {
        console.error("保存エラー:", error);
        alert(`保存中にエラーが発生しました: ${error.message}`);
      } finally {
        loadingSpinner.classList.add('hidden');
      }
    });

    // ドキュメント一覧の読み込み（検索・タグフィルター連動）
    let allDocuments = []; // 全取得データを保持

    async function loadDocumentList() {
      if (!currentUser) return;
      const docListContainer = document.getElementById('doc-list');
      docListContainer.innerHTML = '<p class="text-gray-400 text-sm p-2">読み込み中...</p>';

      try {
        const q = query(
          collection(db, "users", currentUser.uid, "documents"),
          orderBy("updatedAt", "desc")
        );
        const querySnapshot = await getDocs(q);

        allDocuments = [];
        querySnapshot.forEach((docSnap) => {
          allDocuments.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        renderDocumentList(allDocuments);

      } catch (error) {
        console.error("リスト読み込みエラー:", error);
        docListContainer.innerHTML = `<p class="text-red-500 text-sm p-2">読み込みに失敗しました。</p>`;
      }
    }

    // リストの描画処理
    function renderDocumentList(docsToRender) {
      const docListContainer = document.getElementById('doc-list');

      if (docsToRender.length === 0) {
        docListContainer.innerHTML = '<p class="text-gray-500 text-sm italic p-2">該当する問題が見つかりません。</p>';
        return;
      }

      docListContainer.innerHTML = '';
      docsToRender.forEach((data) => {
        const item = document.createElement('div');
        const isSelected = data.id === selectedDocId;

        item.className = `p-3 rounded-lg border cursor-pointer transition ${
          isSelected ? 'bg-blue-50 border-blue-400' : 'bg-white hover:bg-gray-50 border-gray-200'
        }`;

        const tagsHtml = (data.tags || []).map(t => 
          `<span class="inline-block text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded mr-1 mb-1">#${t}</span>`
        ).join('');

        item.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <span class="text-sm font-semibold text-gray-800 truncate" title="${data.title}">${data.title}</span>
            <button class="delete-btn text-xs text-red-400 hover:text-red-600 px-1 py-0.5" data-id="${data.id}">
              削除
            </button>
          </div>
          <div class="flex flex-wrap items-center">
            ${tagsHtml}
            ${data.answerData ? '<span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded ml-auto">解答あり</span>' : ''}
          </div>
        `;

        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-btn')) return;
          selectDocument(data);
        });

        const deleteBtn = item.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (confirm(`「${data.title}」を削除してもよろしいですか？`)) {
            await deleteDoc(doc(db, "users", currentUser.uid, "documents", data.id));
            if (selectedDocId === data.id) {
              clearDocumentView();
            }
            loadDocumentList();
          }
        });

        docListContainer.appendChild(item);
      });
    }

    // タグ・キーワード検索
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', (e) => {
      const queryText = e.target.value.toLowerCase().trim().replace(/^#/, '');
      if (!queryText) {
        renderDocumentList(allDocuments);
        return;
      }

      const filtered = allDocuments.filter(doc => {
        const titleMatch = doc.title.toLowerCase().includes(queryText);
        const tagMatch = (doc.tags || []).some(t => t.toLowerCase().includes(queryText));
        return titleMatch || tagMatch;
      });

      renderDocumentList(filtered);
    });

    // ドキュメント選択・レンダリング
    function selectDocument(docData) {
      selectedDocId = docData.id;
      currentDocData = docData;
      document.getElementById('doc-title').innerText = docData.title;

      // タブの表示・非表示コントロール
      const answerTabBtn = document.getElementById('tab-answer');
      if (docData.answerData) {
        answerTabBtn.classList.remove('hidden');
      } else {
        answerTabBtn.classList.add('hidden');
        activeTab = 'question'; // 強制的に問題タブへ
      }

      updateTabUI();
      renderActiveTabContent();
      renderDocumentList(allDocuments); // ハイライト表示の更新
    }

    // タブ切り替え処理
    document.getElementById('tab-question').addEventListener('click', () => {
      activeTab = 'question';
      updateTabUI();
      renderActiveTabContent();
    });

    document.getElementById('tab-answer').addEventListener('click', () => {
      activeTab = 'answer';
      updateTabUI();
      renderActiveTabContent();
    });

    function updateTabUI() {
      const qTab = document.getElementById('tab-question');
      const aTab = document.getElementById('tab-answer');

      if (activeTab === 'question') {
        qTab.className = "px-4 py-2 font-bold text-blue-600 border-b-2 border-blue-600 text-sm focus:outline-none";
        aTab.className = "px-4 py-2 font-medium text-gray-500 hover:text-gray-700 text-sm focus:outline-none";
      } else {
        aTab.className = "px-4 py-2 font-bold text-blue-600 border-b-2 border-blue-600 text-sm focus:outline-none";
        qTab.className = "px-4 py-2 font-medium text-gray-500 hover:text-gray-700 text-sm focus:outline-none";
      }
    }

    async function renderActiveTabContent() {
      if (!currentDocData) return;
      const previewContainer = document.getElementById('docx-container');
      loadingSpinner.classList.remove('hidden');

      try {
        const targetCompressedData = (activeTab === 'question') 
          ? currentDocData.questionData 
          : currentDocData.answerData;

        if (!targetCompressedData) {
          previewContainer.innerHTML = '<p class="text-center text-gray-400 py-10">データがありません。</p>';
          return;
        }

        const base64String = LZString.decompressFromUTF16(targetCompressedData);
        const arrayBuffer = base64ToArrayBuffer(base64String);

        previewContainer.innerHTML = '';
        await docx.renderAsync(arrayBuffer, previewContainer);

      } catch (error) {
        console.error("レンダリングエラー:", error);
        alert("ファイルの表示に失敗しました。");
      } finally {
        loadingSpinner.classList.add('hidden');
      }
    }

    // クリア処理
    function clearDocumentView() {
      selectedDocId = null;
      currentDocData = null;
      document.getElementById('doc-title').innerText = '未選択';
      document.getElementById('tab-answer').classList.add('hidden');
      activeTab = 'question';
      updateTabUI();

      document.getElementById('docx-container').innerHTML = `
        <div class="text-center text-gray-400 py-20">
          <svg class="mx-auto h-12 w-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <p>左側のリストからファイルを選択するか、新しい問題データを追加してください。</p>
        </div>
      `;
    }
  </script>

  <style>
    /* 明朝体フォールバック設定およびWord文書用カスタムスタイル */
    .docx-viewer {
      background-color: #f8fafc;
      min-height: 500px;
      padding: 20px;
      font-family: "Yu Mincho", "游明朝", "Hiragino Mincho ProN", "MS PMincho", serif !important;
    }
    .docx-viewer .docx-wrapper {
      background: transparent !important;
      padding: 0 !important;
    }
    .docx-viewer section.docx {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
      margin-bottom: 20px !important;
      font-family: inherit !important;
    }
    .docx-viewer p, .docx-viewer span {
      font-family: inherit !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          問題・解答Viewer
        </h1>
        <span id="auth-status" class="px-2 py-1 bg-gray-100 text-gray-800 rounded text-xs font-semibold">初期化中...</span>
      </div>

      <div class="flex items-center space-x-4">
        <!-- ユーザー情報 -->
        <div id="user-info" class="flex items-center space-x-2 hidden">
          <img id="user-photo" src="" class="w-8 h-8 rounded-full border border-gray-300" alt="Avatar">
          <span id="user-name" class="text-sm font-medium text-gray-700"></span>
        </div>

        <!-- ログイン・ログアウトボタン -->
        <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow-sm flex items-center gap-2">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C6.721,2,2,6.721,2,12.545s4.721,10.545,10.545,10.545c6.241,0,10.323-4.39,10.323-10.502c0-0.709-0.063-1.352-0.18-1.951H12.545z"/>
          </svg>
          Googleでログイン
        </button>
        <button id="logout-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-3 py-1.5 rounded-lg text-sm transition hidden">
          ログアウト
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-4 gap-6 opacity-50 pointer-events-none transition-opacity">
    
    <!-- サイドバー：登録＆検索・一覧 -->
    <section class="md:col-span-1 flex flex-col space-y-4">
      
      <!-- アップロード＆フォームエリア -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-sm font-bold text-gray-700 flex items-center gap-1">
          <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          新規問題データの追加
        </h2>

        <div>
          <label class="block text-[11px] font-semibold text-gray-600 mb-1">問題ファイル (.docx) <span class="text-red-500">*必須</span></label>
          <input type="file" id="question-file-input" accept=".docx" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-gray-600 mb-1">解答解説ファイル (.docx) <span class="text-gray-400 font-normal">任意</span></label>
          <input type="file" id="answer-file-input" accept=".docx" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer"/>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-gray-600 mb-1">ハッシュタグ (スペース区切り)</label>
          <input type="text" id="tags-input" placeholder="例: 数学I 三角関数 期末テスト" class="w-full text-xs border border-slate-300 rounded p-1.5 focus:outline-none focus:border-blue-500"/>
        </div>

        <button id="save-doc-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded text-xs transition shadow-sm">
          保存する
        </button>
      </div>

      <!-- 検索＆ファイル一覧 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col space-y-3">
        <h2 class="text-sm font-bold text-gray-700 flex items-center gap-1">
          <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          問題の検索・一覧
        </h2>

        <!-- 検索バー -->
        <input type="text" id="search-input" placeholder="タイトルや #タグ で検索..." class="w-full text-xs border border-slate-300 rounded p-1.5 focus:outline-none focus:border-blue-500"/>

        <!-- 一覧表示コンテナ -->
        <div id="doc-list" class="space-y-2 flex-1 overflow-y-auto max-h-[400px]">
          <!-- 一覧がJavaScriptにより追加されます -->
        </div>
      </div>

    </section>

    <!-- メインビュー：Word閲覧・タブ切替エリア -->
    <section class="md:col-span-3 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
      
      <!-- タイトルバー＆タブ -->
      <div class="border-b border-slate-200 px-6 pt-3 bg-slate-50/50 flex justify-between items-end">
        <div>
          <h2 id="doc-title" class="font-bold text-slate-800 text-base mb-2 truncate">未選択</h2>
          <!-- タブ切替 -->
          <div class="flex space-x-2 border-b border-transparent">
            <button id="tab-question" class="px-4 py-2 font-bold text-blue-600 border-b-2 border-blue-600 text-sm focus:outline-none">
              問題データ
            </button>
            <button id="tab-answer" class="px-4 py-2 font-medium text-gray-500 hover:text-gray-700 text-sm focus:outline-none hidden">
              解答解説
            </button>
          </div>
        </div>

        <div id="loading-spinner" class="hidden flex items-center gap-2 text-xs text-blue-600 mb-3">
          <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
