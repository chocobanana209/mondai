<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONDAI</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- docx-preview Library -->
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.min.js"></script>
  
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- HEIC-to-JPEG Library -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <!-- LZ-String Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-full mx-auto px-4 py-2.5 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <button id="toggle-sidebar-btn" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600 focus:outline-none" title="サイドバー切替">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <h1 class="text-base md:text-lg font-bold text-blue-600 flex items-center gap-1.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          問題学習Viewer
        </h1>
        <span id="auth-status" class="px-2 py-0.5 bg-gray-100 text-gray-800 rounded text-[10px] font-semibold">初期化中...</span>
      </div>

      <div class="flex items-center space-x-3">
        <div id="user-info" class="flex items-center space-x-2 hidden">
          <img id="user-photo" src="" class="w-7 h-7 rounded-full border border-gray-300" alt="Avatar">
          <span id="user-name" class="text-xs font-medium text-gray-700 hidden sm:inline"></span>
        </div>
        
        <button id="header-menu-btn" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1 text-xs font-bold hidden" title="正誤記録・メニュー">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <span class="hidden sm:inline">正誤記録</span>
        </button>

        <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition">
          Googleログイン
        </button>
        <button id="logout-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-2.5 py-1.5 rounded-lg text-xs transition hidden">
          ログアウト
        </button>
      </div>
    </div>
  </header>

  <div class="flex-1 flex relative overflow-hidden">

    <!-- サイドバー -->
    <aside id="sidebar" class="w-80 bg-white border-r border-slate-200 flex flex-col transition-all duration-300 z-10 absolute md:relative h-full">
      <div class="p-3 border-b border-slate-200 space-y-2">
        <button id="btn-nav-register" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          新しい問題を登録 / 編集
        </button>

        <div class="flex bg-slate-100 p-1 rounded-lg">
          <button id="nav-docs" class="flex-1 py-1.5 text-xs font-bold text-blue-600 bg-white rounded shadow-sm">問題一覧</button>
          <button id="nav-collections" class="flex-1 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-700">問題集</button>
        </div>

        <div class="flex gap-1">
          <input type="text" id="search-input" placeholder="検索..." class="w-full text-xs border border-slate-300 rounded p-1.5 focus:outline-none focus:border-blue-500"/>
          <button id="create-collection-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2.5 py-1 rounded font-bold whitespace-nowrap" title="新しい問題集を作成">+</button>
        </div>
      </div>

      <div id="sidebar-list" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </aside>

    <!-- メイン表示領域 -->
    <main id="main-content" class="flex-1 bg-slate-50 flex flex-col overflow-y-auto p-4 opacity-50 pointer-events-none transition-opacity">
      
      <!-- 1. 単体問題 閲覧ビュー -->
      <div id="view-mode-container" class="flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="border-b border-slate-200 px-4 py-3 bg-slate-50 flex justify-between items-center flex-wrap gap-2">
          <div class="flex items-center gap-3">
            <h2 id="doc-title" class="font-bold text-slate-800 text-base truncate">左のリストから問題を選択してください</h2>
            <button id="edit-current-btn" class="hidden text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded">編集する</button>
          </div>
          
          <button id="toggle-answer-pane-btn" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-xs flex items-center gap-1">
            <span>💡 解答解説を表示</span>
          </button>
        </div>

        <div id="content-split-wrapper" class="flex-1 flex overflow-hidden">
          <div id="question-pane" class="flex-1 flex flex-col h-full overflow-hidden bg-white">
            <div class="bg-blue-50 px-4 py-2 border-b border-blue-100 text-xs font-bold text-blue-800 flex items-center justify-between">
              <span>📝 問題</span>
            </div>
            <div id="question-display-area" class="flex-1 p-4 overflow-y-auto space-y-4">
              <div class="text-center text-gray-400 py-20"><p>問題データが選択されていません。</p></div>
            </div>
          </div>

          <div id="answer-pane" class="w-1/2 flex flex-col h-full overflow-hidden bg-white border-l border-slate-200 hidden">
            <div class="bg-emerald-50 px-4 py-2 border-b border-emerald-100 text-xs font-bold text-emerald-800 flex items-center justify-between">
              <span>💡 解答解説</span>
              <button id="close-answer-pane-btn" class="text-emerald-700 hover:text-emerald-900 font-bold px-1 text-sm">✕ 閉じる</button>
            </div>
            <div id="answer-display-area" class="flex-1 p-4 overflow-y-auto space-y-4">
              <div class="text-center text-gray-400 py-20"><p>解答解説はここに表示されます。</p></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. 問題集 プレイビュー -->
      <div id="collection-player-container" class="hidden flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-6">
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h2 id="collection-player-title" class="text-base font-bold text-slate-800">問題集プレイ</h2>
          <button id="exit-collection-btn" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-bold">問題集を終了する</button>
        </div>
        <div id="collection-player-content" class="flex-1 overflow-y-auto space-y-4"></div>
      </div>

      <!-- 3. 登録・編集フォーム -->
      <div id="register-form-container" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4 max-w-4xl mx-auto w-full my-auto">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 id="form-header-title" class="text-base font-bold text-slate-800">新しい問題データの登録</h2>
          <button id="cancel-register-btn" class="text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
        </div>

        <input type="hidden" id="editing-doc-id" value="">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-gray-700 mb-1">問題のタイトル <span class="text-red-500">*必須</span></label>
            <input type="text" id="problem-name-input" placeholder="例: 例題5 DNAの構造" class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">小問番号 (カンマ区切り)</label>
            <input type="text" id="subquestion-input" placeholder="例: (1), (2), (3)" class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"/>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">教科名</label>
            <input type="text" id="subject-input" placeholder="例: 生物" list="subject-list" class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"/>
            <datalist id="subject-list"></datalist>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">単元名</label>
            <input type="text" id="unit-input" placeholder="例: 遺伝子" list="unit-list" class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"/>
            <datalist id="unit-list"></datalist>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">ハッシュタグ (スペース区切り)</label>
          <input type="text" id="tags-input" placeholder="例: 重要 復習" class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"/>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 問題入力＆プレビュー -->
          <div class="border p-3 rounded-lg bg-slate-50 space-y-3">
            <h3 class="text-xs font-bold text-slate-700">【問題データ】</h3>
            <div>
              <label class="block text-[11px] text-gray-600 mb-1">テキスト文面</label>
              <textarea id="q-text-input" rows="3" placeholder="問題文..." class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <div>
              <label class="block text-[11px] text-gray-600 mb-1">添付ファイル</label>
              <input type="file" id="q-file-input" accept=".docx,.pdf,image/*,.heic,.HEIC" multiple class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
            </div>
            <div>
              <label class="block text-[11px] text-gray-600 mb-1 font-bold text-blue-600">問題 ライブプレビュー</label>
              <div id="q-preview-area" class="bg-white border rounded p-2 min-h-[100px] max-h-[200px] overflow-y-auto text-xs"></div>
            </div>
          </div>

          <!-- 解答解説入力＆プレビュー -->
          <div class="border p-3 rounded-lg bg-slate-50 space-y-3">
            <h3 class="text-xs font-bold text-slate-700">【解答解説データ】</h3>
            <div>
              <label class="block text-[11px] text-gray-600 mb-1">解答テキスト文面</label>
              <textarea id="a-text-input" rows="3" placeholder="解答・解説..." class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <div>
              <label class="block text-[11px] text-gray-600 mb-1">添付ファイル</label>
              <input type="file" id="a-file-input" accept=".docx,.pdf,image/*,.heic,.HEIC" multiple class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer"/>
            </div>
            <div>
              <label class="block text-[11px] text-gray-600 mb-1 font-bold text-emerald-600">解答 ライブプレビュー</label>
              <div id="a-preview-area" class="bg-white border rounded p-2 min-h-[100px] max-h-[200px] overflow-y-auto text-xs"></div>
            </div>
          </div>
        </div>

        <button id="save-doc-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-xs transition shadow-sm">
          保存する
        </button>
      </div>

    </main>

  </div>

  <!-- 正誤記録モーダル -->
  <div id="stats-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg max-w-sm w-full p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">正誤記録・成績管理</h3>
        <button id="close-stats-modal" class="text-gray-400 hover:text-gray-600 text-sm font-bold">✕</button>
      </div>
      <div>
        <div class="text-xs font-semibold text-slate-600 mb-1" id="modal-target-title">問題が選択されていません</div>
        <div class="flex items-center justify-between text-xs text-gray-700 bg-slate-50 p-3 rounded-lg border">
          <span>正解数: <strong class="text-green-600 text-sm" id="stat-correct">0</strong> 勝</span>
          <span>誤答数: <strong class="text-red-600 text-sm" id="stat-incorrect">0</strong> 敗</span>
        </div>
      </div>
      <!-- 選択ボタン -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="btn-select-correct" class="border-2 border-green-600 text-green-700 hover:bg-green-50 py-2 rounded text-xs font-bold transition shadow-xs">○ 正解</button>
        <button id="btn-select-incorrect" class="border-2 border-red-600 text-red-700 hover:bg-red-50 py-2 rounded text-xs font-bold transition shadow-xs">× 誤答</button>
      </div>
      <!-- 決定ボタン -->
      <button id="btn-record-commit" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2 rounded text-xs font-bold transition shadow-xs hidden">決定する</button>
    </div>
  </div>

  <!-- 問題集編集モーダル -->
  <div id="collection-edit-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6 space-y-4 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm" id="coll-modal-title">問題集の編集</h3>
        <button id="close-coll-modal" class="text-gray-400 hover:text-gray-600 text-sm font-bold">✕</button>
      </div>
      <input type="hidden" id="editing-coll-id" value="">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">問題集の名前</label>
        <input type="text" id="coll-name-input" class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"/>
      </div>
      <div class="flex-1 overflow-y-auto space-y-1 border rounded p-2 bg-slate-50">
        <label class="block text-[11px] font-bold text-gray-600 mb-1">含める問題の選択</label>
        <div id="coll-problems-checkbox-list" class="space-y-1"></div>
      </div>
      <button id="save-coll-modal-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-xs font-bold transition">問題集を保存する</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
