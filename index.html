<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問題・解答学習Viewer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- docx-preview Library -->
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.min.js"></script>
  
  <!-- PDF.js Library (PDF表示用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- LZ-String Library (圧縮用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-full mx-auto px-4 py-2.5 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <!-- サイドバー開閉ボタン -->
        <button id="toggle-sidebar-btn" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-600 focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <h1 class="text-base md:text-lg font-bold text-blue-600 flex items-center gap-1.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          問題学習Viewer
        </h1>
        <span id="auth-status" class="px-2 py-0.5 bg-gray-100 text-gray-800 rounded text-[10px] font-semibold">初期化中...</span>
      </div>

      <div class="flex items-center space-x-3">
        <div id="user-info" class="flex items-center space-x-2 hidden">
          <img id="user-photo" src="" class="w-7 h-7 rounded-full border border-gray-300" alt="Avatar">
          <span id="user-name" class="text-xs font-medium text-gray-700 hidden sm:inline"></span>
        </div>
        <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition">
          Googleログイン
        </button>
        <button id="logout-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-2.5 py-1.5 rounded-lg text-xs transition hidden">
          ログアウト
        </button>
      </div>
    </div>
  </header>

  <div class="flex-1 flex relative overflow-hidden">

    <!-- 折りたたみ式サイドバー -->
    <aside id="sidebar" class="w-80 bg-white border-r border-slate-200 flex flex-col transition-all duration-300 z-10 absolute md:relative h-full">
      
      <!-- ナビゲーション切り替えボタン群 -->
      <div class="p-3 border-b border-slate-200 space-y-2">
        <button id="btn-nav-register" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center gap-1 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          新しい問題を登録 / 編集
        </button>

        <div class="flex bg-slate-100 p-1 rounded-lg">
          <button id="nav-docs" class="flex-1 py-1.5 text-xs font-bold text-blue-600 bg-white rounded shadow-sm">問題一覧</button>
          <button id="nav-collections" class="flex-1 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-700">問題集</button>
        </div>

        <div class="flex gap-1">
          <input type="text" id="search-input" placeholder="検索..." class="w-full text-xs border border-slate-300 rounded p-1.5 focus:outline-none focus:border-blue-500"/>
          <button id="create-collection-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-2.5 py-1 rounded font-bold whitespace-nowrap" title="新しい問題集を作成">+</button>
        </div>
      </div>

      <!-- リストエリア -->
      <div id="sidebar-list" class="flex-1 overflow-y-auto p-3 space-y-2">
        <!-- JSで一覧が追加されます -->
      </div>

      <!-- 選択中問題の正誤記録エリア (サイドバー下部) -->
      <div id="sidebar-stats-card" class="hidden p-3 bg-slate-50 border-t border-slate-200 space-y-2">
        <div class="text-xs font-bold text-slate-700 truncate" id="sidebar-target-title">未選択</div>
        <div class="flex items-center justify-between text-xs text-gray-600">
          <span>成績: <strong class="text-green-600" id="stat-correct">0</strong> 勝 <strong class="text-red-600" id="stat-incorrect">0</strong> 敗</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-record-correct" class="bg-green-600 hover:bg-green-700 text-white py-1.5 rounded text-xs font-bold transition shadow-xs">○ 正解</button>
          <button id="btn-record-incorrect" class="bg-red-600 hover:bg-red-700 text-white py-1.5 rounded text-xs font-bold transition shadow-xs">× 誤答</button>
        </div>
      </div>

    </aside>

    <!-- メイン表示領域 -->
    <main id="main-content" class="flex-1 bg-slate-50 flex flex-col overflow-y-auto p-4 opacity-50 pointer-events-none transition-opacity">
      
      <!-- 1. 閲覧ビュー -->
      <div id="view-mode-container" class="flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="border-b border-slate-200 px-4 py-3 bg-slate-50 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <h2 id="doc-title" class="font-bold text-slate-800 text-base truncate">左のリストから問題を選択してください</h2>
            <button id="edit-current-btn" class="hidden text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded">編集する</button>
          </div>
          
          <div class="flex space-x-2">
            <button id="tab-question" class="px-3 py-1 font-bold text-blue-600 border-b-2 border-blue-600 text-xs focus:outline-none">問題</button>
            <button id="tab-answer" class="px-3 py-1 font-medium text-gray-500 hover:text-gray-700 text-xs focus:outline-none hidden">解答解説</button>
          </div>
        </div>

        <!-- 素材レンダリングエリア -->
        <div id="content-display-area" class="flex-1 p-4 overflow-y-auto space-y-4">
          <div class="text-center text-gray-400 py-20">
            <p>問題データが選択されていません。</p>
          </div>
        </div>
      </div>

      <!-- 2. 問題の登録・編集フォーム (モーダル風/画面切替) -->
      <div id="register-form-container" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4 max-w-3xl mx-auto w-full my-auto">
        <div class="flex justify-between items-center border-b pb-3">
          <h2 id="form-header-title" class="text-base font-bold text-slate-800">新しい問題データの登録</h2>
          <button id="cancel-register-btn" class="text-xs text-slate-500 hover:text-slate-800">キャンセル</button>
        </div>

        <input type="hidden" id="editing-doc-id" value="">

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">問題のタイトル <span class="text-red-500">*必須</span></label>
          <input type="text" id="problem-name-input" placeholder="例: 2026年度 数学I 第2問" class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">ハッシュタグ (スペース区切り)</label>
          <input type="text" id="tags-input" placeholder="例: 数学 図形 復習" class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"/>
        </div>

        <!-- 問題データ（複数要素の組み合わせ） -->
        <div class="border p-3 rounded-lg bg-slate-50 space-y-3">
          <h3 class="text-xs font-bold text-slate-700">【問題データ】追加素材</h3>
          
          <div>
            <label class="block text-[11px] text-gray-600 mb-1">テキスト文面</label>
            <textarea id="q-text-input" rows="3" placeholder="問題文を入力..." class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"></textarea>
          </div>

          <div>
            <label class="block text-[11px] text-gray-600 mb-1">添付ファイル (Word / PDF / 画像)</label>
            <input type="file" id="q-file-input" accept=".docx,.pdf,image/*" multiple class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
          </div>
        </div>

        <!-- 解答データ（複数要素の組み合わせ） -->
        <div class="border p-3 rounded-lg bg-slate-50 space-y-3">
          <h3 class="text-xs font-bold text-slate-700">【解答解説データ】追加素材 (任意)</h3>
          
          <div>
            <label class="block text-[11px] text-gray-600 mb-1">解答テキスト文面</label>
            <textarea id="a-text-input" rows="3" placeholder="解答や解説を入力..." class="w-full text-xs border border-slate-300 rounded p-2 focus:outline-none focus:border-blue-500"></textarea>
          </div>

          <div>
            <label class="block text-[11px] text-gray-600 mb-1">添付ファイル (Word / PDF / 画像)</label>
            <input type="file" id="a-file-input" accept=".docx,.pdf,image/*" multiple class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer"/>
          </div>
        </div>

        <button id="save-doc-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-xs transition shadow-sm">
          保存する
        </button>
      </div>

    </main>

  </div>

  <!-- Firebase & Main Application Script -->
  <script type="module" src="script.js"></script>
</body>
</html>
